<!doctype html><html><head><meta charset="utf-8"><style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;width:620px;background:#07111e;color:#eaf2fb}header{display:flex;justify-content:space-between;align-items:center;background:#0e1d30;padding:12px 14px;border-bottom:1px solid #203753}h1{margin:0;font-size:18px}button{background:#132740;color:#fff;border:1px solid #31506f;border-radius:8px;padding:7px 9px;font-weight:700;cursor:pointer}.primary{background:#2563eb}.top{display:flex;gap:7px}.status{padding:7px 12px;color:#8fa5be;font-size:11px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 12px 12px}.card{border:1px solid #203751;background:#0b192a;border-radius:10px;padding:10px;min-width:0}.card h2{font-size:12px;margin:0 0 8px;color:#9fc1e7;text-transform:uppercase;letter-spacing:.06em}.kv{display:grid;grid-template-columns:110px 1fr;gap:5px;font-size:11px;margin:4px 0}.kv b{color:#839bb6}.kv span{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-all}.buttons{display:flex;gap:6px;flex-wrap:wrap}.list{max-height:185px;overflow:auto;font:10px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-all}.item{padding:5px 0;border-bottom:1px solid #172c45}.error{color:#fda4af}.good{color:#86efac}.wide{grid-column:1/-1}</style></head><body><header><div><h1>🎲 BGA Dev Buddy</h1><div style="font-size:10px;color:#8da3bb">Board Game Arena context + shortcuts</div></div><div class="top"><button id="refresh" class="primary">Scan</button><button id="copy">Copy Context</button></div></header><div id="status" class="status">Scanning current BGA page…</div><div class="grid"><section class="card"><h2>Detected Context</h2><div id="context"></div></section><section class="card"><h2>Quick Links</h2><div id="links" class="buttons"></div></section><section class="card"><h2>Page / Globals</h2><div id="globals" class="list"></div></section><section class="card"><h2>Runtime Errors</h2><div id="errors" class="list"></div><button id="clearErrors">Clear captured errors</button></section><section class="card wide"><h2>Assets</h2><div id="assets" class="list"></div></section></div><script src="popup.js"></script></body></html>
