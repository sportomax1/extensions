<!doctype html><html><head><meta charset="utf-8"><style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;width:440px;background:#09111f;color:#e5eef9}header{padding:14px 15px 9px;background:linear-gradient(135deg,#101f38,#101728)}h1{font-size:18px;margin:0}small,.muted{color:#8fa2ba}.toolbar{display:grid;grid-template-columns:1fr auto auto;gap:7px;padding:10px 12px}.toolbar input,.add textarea,.edit input{background:#0d1829;border:1px solid #263a55;color:white;border-radius:9px;padding:9px}.toolbar button,button{border:1px solid #2d4564;background:#14243a;color:#eaf2fb;border-radius:9px;padding:8px 10px;font-weight:700;cursor:pointer}.toolbar button.primary,.primary{background:#2563eb;border-color:#2563eb}.add{padding:0 12px 10px}.add textarea{width:100%;height:62px;resize:vertical}.addrow{display:flex;gap:7px;margin-top:6px}.addrow input{flex:1;background:#0d1829;border:1px solid #263a55;color:#fff;border-radius:8px;padding:8px}.stats{padding:0 13px 8px;font-size:11px;color:#8fa2ba}.list{max-height:440px;overflow:auto;padding:0 10px 12px}.item{border:1px solid #1f334c;background:#0d1829;border-radius:11px;padding:10px;margin:7px 0}.item.pinned{border-color:#d99f2b}.top{display:flex;align-items:center;gap:8px}.title{font-weight:800;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.badge{font-size:10px;background:#172840;border-radius:999px;padding:3px 6px;color:#aac0da}.text{font:11px/1.38 ui-monospace,SFMono-Regular,Menlo,monospace;color:#c5d3e5;white-space:pre-wrap;max-height:74px;overflow:hidden;margin:7px 0}.tags{font-size:10px;color:#8fa2ba}.actions{display:flex;gap:6px;justify-content:flex-end;margin-top:8px}.actions button{font-size:11px;padding:5px 8px}.empty{text-align:center;color:#8194ac;padding:35px 10px}
</style></head><body><header><h1>📋 Clipboard Buddy</h1><small>Capture, pin, search, tag, and reuse snippets.</small></header><div class="toolbar"><input id="search" placeholder="Search snippets, text, tags…"><button id="capture" class="primary">Capture Clipboard</button><button id="clear">Clear unpinned</button></div><div class="add"><textarea id="manual" placeholder="Paste or type a snippet to save…"></textarea><div class="addrow"><input id="tags" placeholder="tags, comma separated"><button id="add">Save snippet</button></div></div><div id="stats" class="stats"></div><div id="list" class="list"></div><script src="popup.js"></script></body></html>
