<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"></head><body>
<header><div><b>{ } API Lens</b><small>REST request workbench</small></div><span id="status">Ready</span></header>
<section class="request"><select id="method"><option>GET</option><option>POST</option><option>PUT</option><option>PATCH</option><option>DELETE</option><option>HEAD</option></select><input id="url" placeholder="https://api.example.com/data"><button id="send">SEND</button></section>
<section class="quick"><button data-example="json">JSONPlaceholder</button><button data-example="espn">ESPN Scoreboard</button><button id="clear">Clear</button></section>
<details><summary>Request headers & body</summary><label>Headers JSON</label><textarea id="headers" spellcheck="false">{}</textarea><label>Request body</label><textarea id="body" spellcheck="false"></textarea></details>
<div id="meta"></div>
<nav><button data-v="pretty" class="on">Pretty JSON</button><button data-v="raw">Raw</button><button data-v="headers">Response Headers</button><button data-v="table">Table</button><button id="copy">Copy</button><button id="download">Download</button><button id="save">★ Save</button></nav>
<pre id="out">Enter an API URL and press SEND.</pre>
<section class="saved"><div class="saved-head"><b>Saved / recent requests</b><button id="clearHistory">Clear history</button></div><div id="saved"></div></section>
<script src="popup.js"></script></body></html>
