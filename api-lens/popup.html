<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="style.css"></head><body><header><div><h1>🔬 API Lens 2.0</h1><small>API Client + Page Sniffer</small></div><nav class="mainTabs"><button data-main="request" class="on">API Client</button><button data-main="sniffer">Page Sniffer</button></nav></header><main id="request" class="main on"><section class="req"><div class="requestLine"><select id="method"><option>GET</option><option>POST</option><option>PUT</option><option>PATCH</option><option>DELETE</option><option>HEAD</option><option>OPTIONS</option></select><input id="url" placeholder="https://api.example.com/v1/items"><button id="send" class="primary">SEND</button></div><div class="editors"><label>REQUEST HEADERS (JSON)<textarea id="headers">{}</textarea></label><label>REQUEST BODY<textarea id="body" placeholder='{"example": true}'></textarea></label></div><div class="row"><button id="save">Save Request</button><button id="clearReq">Clear</button><button data-example="json">JSON Example</button><button data-example="espn">ESPN Example</button><span id="status"></span></div></section><section class="response"><div id="meta">No response yet.</div><nav class="subtabs"><button data-view="pretty" class="on">Pretty</button><button data-view="raw">Raw</button><button data-view="headers">Headers</button><button data-view="table">Table</button><span></span><button id="copyResp">Copy</button><button id="download">Download</button></nav><div id="out" class="output">Enter an API URL and press SEND.</div></section><section class="saved"><div class="savedHead"><b>Saved + Recent Requests</b><button id="clearHistory">Clear recent</button></div><div id="savedList"></div></section></main><main id="sniffer" class="main"><section class="sniffControls"><button id="startSniff" class="primary">Start Sniffing</button><button id="stopSniff">Stop</button><button id="clearSniff">Clear</button><label><input id="apiOnly" type="checkbox" checked> API calls only</label><select id="kind"><option value="all">All types</option><option value="fetch">fetch</option><option value="xhr">XHR</option><option value="resource">Resources</option></select><input id="filter" placeholder="Filter URL, method, status…"><span id="sniffState">Stopped</span></section><section class="sniffGrid"><div id="calls" class="calls"><div class="empty">Start sniffing, then use the webpage.</div></div><div class="detail"><div id="detailMeta" class="detailMeta">Select a captured call.</div><div class="detailActions"><button id="toTester" class="primary">Send to API Client</button><button id="copyCurl">Copy cURL</button><button id="copyEntry">Copy JSON</button></div><pre id="detail"></pre></div></section></main><script src="popup.js"></script></body></html>
