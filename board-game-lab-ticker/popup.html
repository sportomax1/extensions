<!doctype html><html><head><meta charset="utf-8"><style>body{width:330px;margin:0;background:#0b1018;color:#eef2f7;font:13px system-ui;padding:16px}h2{margin:0 0 4px}p{margin:0 0 14px;color:#91a1b5;font-size:11px}label{display:block;margin:10px 0 4px;color:#aab7c8;font-size:11px}input,select{width:100%;padding:8px;border:1px solid #2b3545;border-radius:7px;background:#121a27;color:white}button{margin-top:12px;width:100%;padding:9px;border:0;border-radius:8px;background:#5b7cfa;color:white;font-weight:700;cursor:pointer}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.toggle{background:#253044}.hint{margin-top:10px;color:#728198;font-size:10px}</style></head><body><h2>🎲 Board Game Lab Ticker</h2><p>BGG collection ticker using your Board Game Lab proxy.</p><label>BGG username</label><input id="username"><label>Mode</label><select id="mode"><option value="most">Most Played</option><option value="least">Least Played</option><option value="rating">Highest Rated</option><option value="unplayed">Unplayed</option><option value="random">Random</option></select><div class="row"><div><label>Games</label><input id="limit" type="number" min="5" max="100"></div><div><label>Speed</label><input id="speed" type="number" min="8" max="80"></div></div><div class="row"><button id="toggle" class="toggle">Show / Hide</button><button id="refresh">Refresh Data</button></div><div class="hint">Hover pauses. Click a game to open its BGG page. Settings persist across tabs.</div><script src="popup.js"></script></body></html>
