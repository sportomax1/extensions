<!doctype html><html><head><meta charset="utf-8"><style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;width:470px;background:#08111e;color:#edf5ff}header{padding:13px 14px;background:linear-gradient(135deg,#29164c,#102442)}h1{font-size:18px;margin:0}.muted{font-size:10px;color:#a4a9c8}.section{padding:10px 12px;border-bottom:1px solid #1d3048}.row{display:grid;grid-template-columns:1fr 180px;align-items:center;gap:8px;margin:7px 0;font-size:11px}select,input{background:#0f2035;border:1px solid #304966;color:#fff;border-radius:8px;padding:7px}input[type=range]{padding:0}.map{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}.key{background:#0d1c2e;border:1px solid #273d57;border-radius:8px;padding:5px;text-align:center}.key b{font-size:10px;color:#869db7}.key input{width:100%;text-align:center;font-size:18px;padding:4px;margin-top:3px}.actions{display:flex;gap:7px;padding:10px 12px}.actions button{flex:1;background:#142942;border:1px solid #31506f;color:#fff;border-radius:8px;padding:8px;font-weight:700}.actions .primary{background:#7c3aed}.heat{display:grid;grid-template-columns:repeat(13,1fr);gap:4px}.heat div{text-align:center;background:#102238;border-radius:5px;padding:4px 1px;font-size:9px}.heat b{display:block;color:#fff}.heat span{color:#7f96af}</style></head><body><header><h1>🎉 Emoji Keys 2.0</h1><div class="muted">Emoji replacement + typing effects + sounds + heatmap</div></header><div class="section"><div class="row"><span>Mode</span><select id="mode"><option value="off">Off</option><option value="animate">Animate only</option><option value="replace">Replace letters only</option><option value="both">Replace + animate</option></select></div><div class="row"><span>Effect</span><select id="effect"><option value="float">Float</option><option value="burst">Burst</option><option value="confetti">Confetti</option><option value="trail">Trail</option><option value="rain">Emoji rain</option><option value="sparkle">Sparkle</option></select></div><div class="row"><span>Sound</span><select id="sound"><option value="off">Off</option><option value="pop">Pop</option><option value="typewriter">Typewriter</option><option value="bubble">Bubble</option><option value="chime">Chime</option></select></div><div class="row"><span>Emoji size <b id="sizeV"></b></span><input id="size" type="range" min="18" max="80"></div><div class="row"><span>Effect duration <b id="durationV"></b></span><input id="duration" type="range" min="250" max="1800" step="50"></div><div class="row"><span>Intensity <b id="intensityV"></b></span><input id="intensity" type="range" min="1" max="10"></div><div class="row"><span>Keyboard heatmap</span><input id="heatmap" type="checkbox"></div><div class="row"><span>Streak boosts</span><input id="streaks" type="checkbox"></div></div><div class="section"><div style="font-size:11px;font-weight:800;margin-bottom:7px">A–Z custom mapping</div><div id="map" class="map"></div></div><div class="section"><div style="font-size:11px;font-weight:800;margin-bottom:7px">Typing heatmap</div><div id="heat" class="heat"></div></div><div class="actions"><button id="reset">Reset Mapping</button><button id="clearHeat">Clear Heatmap</button><button id="save" class="primary">Save</button></div><script src="popup.js"></script></body></html>
