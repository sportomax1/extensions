<!doctype html><html><head><meta charset="utf-8"><style>*{box-sizing:border-box}body{width:360px;margin:0;padding:14px;background:#111827;color:white;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}h2{margin:0 0 4px}.sub{font-size:11px;color:#9ca3af;margin:0 0 12px}select,button,input{width:100%;padding:9px;margin:5px 0;border:1px solid #374151;border-radius:8px;background:#1f2937;color:#fff}button{background:#2563eb;border:0;font-weight:750;cursor:pointer}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:10px}.grid span{background:#1f2937;padding:6px;border-radius:6px;text-align:center;font-size:12px}.note{font-size:11px;color:#9ca3af;line-height:1.45;margin-top:8px}label{font-size:11px;color:#cbd5e1}</style></head><body><h2>✨ Emoji Keys</h2><p class="sub">Turn normal A–Z keypresses into visual emoji reactions or emoji text.</p><label>Mode</label><select id="mode"><option value="off">Off</option><option value="animate">Animate only — keep typed letter</option><option value="replace">Replace letter with emoji + animate</option><option value="insert">Replace letter with emoji</option></select><div class="row"><label>Emoji size<input id="size" type="number" min="24" max="96" step="2"></label><label>Animation ms<input id="duration" type="number" min="250" max="1800" step="50"></label></div><button id="apply">Apply</button><div class="note">Effects run only while typing in normal editable fields. Ctrl/Cmd/Alt shortcuts are ignored.</div><div class="grid" id="grid"></div><script src="popup.js"></script></body></html>
