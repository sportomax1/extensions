<!doctype html><html><head><meta charset="utf-8"><style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;width:780px;background:#07101d;color:#e7f0fb}header{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:#0d1c30;border-bottom:1px solid #213754}h1{margin:0;font-size:18px}.badge{font:700 11px ui-monospace,SFMono-Regular,Menlo,monospace;background:#16304e;border:1px solid #315270;border-radius:999px;padding:5px 9px}.toolbar{display:flex;gap:7px;padding:9px 12px;border-bottom:1px solid #172b45;flex-wrap:wrap}button,select,input{background:#10243b;color:#eff7ff;border:1px solid #2e4b6b;border-radius:8px;padding:7px 9px;font-weight:700}.primary{background:#2563eb;border-color:#2563eb}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 12px}.pane{display:flex;flex-direction:column;min-width:0}.label{font-size:11px;color:#91a7bf;margin:0 0 5px}textarea{width:100%;height:430px;resize:none;background:#06101c;border:1px solid #223a57;border-radius:9px;color:#cfe0f2;padding:10px;font:11px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;tab-size:2}.foot{padding:0 12px 10px;color:#879cb5;font-size:10px}.ok{color:#86efac}.error{color:#fda4af}</style></head><body><header><div><h1>✨ Pretty Print</h1><div style="font-size:10px;color:#8da3bb">Smart text/string formatter</div></div><span id="detected" class="badge">AUTO</span></header><div class="toolbar"><select id="type"><option value="auto">Auto detect</option><option>json</option><option>xml</option><option>html</option><option>css</option><option>sql</option><option>csv</option><option>tsv</option><option>url</option><option>query</option><option>jwt</option><option>base64</option><option>escaped</option><option>log</option><option>text</option></select><button id="format" class="primary">Format</button><button id="minify">Minify</button><button id="decode">Decode / Unescape</button><button id="paste">Paste</button><button id="copy">Copy Output</button><button id="swap">Output → Input</button><button id="clear">Clear</button></div><div class="grid"><div class="pane"><div class="label">INPUT</div><textarea id="input" spellcheck="false" placeholder="Paste almost any text string here…"></textarea></div><div class="pane"><div class="label">FORMATTED OUTPUT</div><textarea id="output" spellcheck="false" readonly></textarea></div></div><div id="status" class="foot">Supports structural formatting plus best-effort heuristics for minified and semi-structured text.</div><script src="popup.js"></script></body></html>
